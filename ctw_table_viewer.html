<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTW Database Viewer - Interactive Tables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-sidebar: #111827;
      --bg-card: #1F2937;
      --bg-card-subtle: #192231;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-active: #6366F1;
      --text-primary: #F9FAFB;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --badge-green-bg: rgba(16, 185, 129, 0.15);
      --badge-green-text: #34D399;
      --badge-blue-bg: rgba(59, 130, 246, 0.15);
      --badge-blue-text: #60A5FA;
      --badge-purple-bg: rgba(168, 85, 247, 0.15);
      --badge-purple-text: #C084FC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 290px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .table-search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.05);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .table-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      list-style: none;
    }

    .table-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .table-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .table-item.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .table-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      font-family: 'JetBrains Mono', monospace;
    }

    .table-item.active .table-badge {
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
    }

    /* Main Content */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-main);
    }

    .top-bar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .current-table-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .stat-badge {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Controls Bar */
    .controls-bar {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(17, 24, 39, 0.4);
    }

    .search-input-wrap {
      position: relative;
      width: 320px;
    }

    .search-input-wrap input {
      padding-left: 32px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .row-info {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: auto;
    }

    /* Table Container */
    .table-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      background: var(--bg-main);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      background: #151D2A;
      color: #94A3B8;
      font-weight: 600;
      font-size: 12px;
      padding: 12px 16px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      z-index: 10;
      transition: color 0.15s;
    }

    th:hover {
      color: #F8FAFC;
    }

    th .sort-arrow {
      margin-left: 6px;
      font-size: 10px;
      opacity: 0.5;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #E2E8F0;
      white-space: nowrap;
      max-width: 450px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .val-null {
      color: #64748B;
      font-style: italic;
    }

    .val-bool-true {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .val-bool-false {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .val-json {
      color: #FBBF24;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">CTW</div>
      <div>
        <div class="brand-title">PostgreSQL Viewer</div>
        <div class="brand-sub">ctw.sql • 18 Tables</div>
      </div>
    </div>

    <div class="table-search-box">
      <input type="text" id="tableFilterInput" class="input-field" placeholder="Filter tables..." oninput="filterTableList()">
    </div>

    <ul class="table-list" id="tableList"></ul>
  </aside>

  <!-- Main View -->
  <main class="main-view">
    <header class="top-bar">
      <div class="header-left">
        <h1 class="current-table-name" id="currentTableName">Select a table</h1>
        <span class="stat-badge" id="tableStats">0 rows</span>
      </div>

      <div class="top-actions">
        <button class="btn" onclick="exportCurrentCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export CSV
        </button>
        <button class="btn" onclick="exportCurrentJSON()">Export JSON</button>
      </div>
    </header>

    <div class="controls-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="rowSearchInput" class="input-field" placeholder="Search rows in table..." oninput="filterRows()">
      </div>
      <div class="row-info" id="rowStatus">Showing all records</div>
    </div>

    <div class="table-container" id="tableContainer">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

    let activeTable = Object.keys(DB_DATA)[0] || '';
    let sortCol = null;
    let sortAsc = true;

    function renderSidebar() {
      const listEl = document.getElementById('tableList');
      listEl.innerHTML = '';
      const filter = document.getElementById('tableFilterInput').value.toLowerCase();

      Object.keys(DB_DATA).forEach(tbl => {
        if (filter && !tbl.toLowerCase().includes(filter)) return;
        const li = document.createElement('li');
        li.className = 'table-item' + (tbl === activeTable ? ' active' : '');
        li.onclick = () => selectTab(tbl);

        li.innerHTML = `
          <span>${tbl}</span>
          <span class="table-badge">${DB_DATA[tbl].count}</span>
        `;
        listEl.appendChild(li);
      });
    }

    function filterTableList() {
      renderSidebar();
    }

    function selectTab(tbl) {
      activeTable = tbl;
      sortCol = null;
      sortAsc = true;
      document.getElementById('rowSearchInput').value = '';
      renderSidebar();
      renderTable();
    }

    function renderTable() {
      if (!activeTable || !DB_DATA[activeTable]) return;

      const tblData = DB_DATA[activeTable];
      document.getElementById('currentTableName').textContent = activeTable;
      document.getElementById('tableStats').textContent = `${tblData.count} rows • ${tblData.columns.length} cols`;

      // Render Head
      const thead = document.getElementById('tableHead');
      thead.innerHTML = `
        <tr>
          <th style="width: 48px; text-align: center;">#</th>
          ${tblData.columns.map((c, idx) => `
            <th onclick="toggleSort(${idx})">
              ${c}
              <span class="sort-arrow">${sortCol === idx ? (sortAsc ? '▲' : '▼') : '↕'}</span>
            </th>
          `).join('')}
        </tr>
      `;

      // Filter & Sort
      const query = document.getElementById('rowSearchInput').value.toLowerCase();
      let filtered = tblData.rows.filter(row => {
        if (!query) return true;
        return row.some(cell => String(cell || '').toLowerCase().includes(query));
      });

      if (sortCol !== null) {
        filtered.sort((a, b) => {
          let valA = a[sortCol];
          let valB = b[sortCol];
          if (valA === valB) return 0;
          if (valA === null) return 1;
          if (valB === null) return -1;
          return (valA > valB ? 1 : -1) * (sortAsc ? 1 : -1);
        });
      }

      document.getElementById('rowStatus').textContent = `Showing ${filtered.length} of ${tblData.count} rows`;

      // Render Body
      const tbody = document.getElementById('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${tblData.columns.length + 1}" class="empty-state">No matching records found</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((row, rIdx) => `
        <tr>
          <td style="text-align: center; color: var(--text-muted); font-size: 11px;">${rIdx + 1}</td>
          ${row.map(cell => formatCell(cell)).join('')}
        </tr>
      `).join('');
    }

    function formatCell(val) {
      if (val === null || val === undefined || val === '') {
        return `<td class="val-null">NULL</td>`;
      }
      if (val === 'True' || val === true || val === 't' || val === 'true') {
        return `<td><span class="val-bool-true">TRUE</span></td>`;
      }
      if (val === 'False' || val === false || val === 'f' || val === 'false') {
        return `<td><span class="val-bool-false">FALSE</span></td>`;
      }
      const strVal = String(val);
      if (strVal.startsWith('{') || strVal.startsWith('[')) {
        return `<td class="val-json" title="${escapeHtml(strVal)}">${escapeHtml(strVal.length > 55 ? strVal.slice(0, 55) + '...' : strVal)}</td>`;
      }
      return `<td title="${escapeHtml(strVal)}">${escapeHtml(strVal)}</td>`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleSort(colIdx) {
      if (sortCol === colIdx) {
        sortAsc = !sortAsc;
      } else {
        sortCol = colIdx;
        sortAsc = true;
      }
      renderTable();
    }

    function filterRows() {
      renderTable();
    }

    function exportCurrentCSV() {
      const tblData = DB_DATA[activeTable];
      if (!tblData) return;
      let csv = tblData.columns.join(',') + '\n';
      tblData.rows.forEach(r => {
        csv += r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',') + '\n';
      });
      downloadFile(`${activeTable}.csv`, csv, 'text/csv');
    }

    function exportCurrentJSON() {
      const tblData = DB_DATA[activeTable];
      if (!tblData) return;
      const formatted = tblData.rows.map(row => {
        let obj = {};
        tblData.columns.forEach((col, i) => obj[col] = row[i]);
        return obj;
      });
      downloadFile(`${activeTable}.json`, JSON.stringify(formatted, null, 2), 'application/json');
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Init
    renderSidebar();
    renderTable();
  </script>
